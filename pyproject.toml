[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-git-conflict-semantic-resolver"
version = "0.1.0"
description = "3-way AST merge engine resolving complex git merge conflicts at the syntax-tree level rather than naive text lines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-git-conflict-semantic-resolver = "agent_git_conflict_semantic_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_git_conflict_semantic_resolver*"]
